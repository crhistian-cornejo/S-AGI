appId: com.sagi.app
productName: S-AGI
copyright: Copyright 2025 S-AGI

directories:
  buildResources: build
  output: release

# Files relative to project directory (apps/electron)
files:
  - from: ../../out
    to: .
    filter:
      - "**/*"
  - from: ../../package.json
    to: package.json
  - from: ../../node_modules
    to: node_modules
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"

# Extra resources bundled outside ASAR (accessible at runtime)
extraResources:
  - from: resources/dictionaries
    to: dictionaries
    filter:
      - "**/*"
  - from: resources/fonts
    to: fonts
    filter:
      - "**/*"
  - from: resources/pdfium.wasm
    to: pdfium.wasm

asar: true
# Unpack native modules so they can load correctly
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

# Disable npm rebuild - we bundle pre-built node_modules from monorepo root
npmRebuild: false
buildDependenciesFromSource: false

protocols:
  - name: S-AGI
    schemes:
      - s-agi

# macOS Configuration
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  identity: "${env.APPLE_IDENTITY}"
  notarize:
    teamId: "${env.APPLE_TEAM_ID}"
  artifactName: "S-AGI-${arch}.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: "S-AGI needs microphone access for voice input"

dmg:
  artifactName: "S-AGI-${arch}.dmg"
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 150
      type: file
    - x: 400
      y: 150
      type: link
      path: /Applications
  iconSize: 80

# Windows Configuration
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "S-AGI-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Auto-update configuration
publish:
  provider: generic
  url: https://releases.sagi.app
