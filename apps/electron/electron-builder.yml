appId: com.sagi.app
productName: S-AGI
copyright: Copyright 2025 S-AGI

directories:
  buildResources: apps/electron/build
  output: apps/electron/release

# Files relative to monorepo root (no --project flag)
files:
  - "out/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"

# Extra resources bundled outside ASAR (accessible at runtime)
extraResources:
  - from: apps/electron/resources/dictionaries
    to: dictionaries
    filter:
      - "**/*"
  - from: apps/electron/resources/fonts
    to: fonts
    filter:
      - "**/*"
  - from: apps/electron/resources/pdfium.wasm
    to: pdfium.wasm

asar: true
# Unpack native modules so they can load correctly
asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

# Disable npm rebuild - we bundle pre-built node_modules from monorepo root
npmRebuild: false
buildDependenciesFromSource: false

protocols:
  - name: S-AGI
    schemes:
      - s-agi

# macOS Configuration
mac:
  icon: apps/electron/build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: apps/electron/build/entitlements.mac.plist
  entitlementsInherit: apps/electron/build/entitlements.mac.plist
  identity: "${env.APPLE_IDENTITY}"
  notarize:
    teamId: "${env.APPLE_TEAM_ID}"
  artifactName: "S-AGI-${version}-macOS-${arch}.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: "S-AGI needs microphone access for voice input"
    NSCameraUsageDescription: "S-AGI needs camera access to capture profile photos"

dmg:
  artifactName: "S-AGI-${version}-macOS-${arch}.dmg"
  # Paths are relative to buildResources (apps/electron/build)
  background: dmg-background.png
  icon: icon.icns
  iconSize: 100
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications

# Windows Configuration
win:
  icon: apps/electron/build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "S-AGI-${version}-Windows-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # Paths are relative to buildResources (apps/electron/build)
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  installerHeader: installer-header.png
  uninstallerHeader: installer-header.png
  installerSidebar: installer-sidebar.png
  uninstallerSidebar: installer-sidebar.png
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: S-AGI
  runAfterFinish: true
  menuCategory: true

# Auto-update configuration - Uses GitHub Releases
publish:
  provider: github
  owner: crhistian-cornejo
  repo: S-AGI
  releaseType: release
