name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun i

      - name: Build and package macOS
        run: bun run electron:dist:mac

      - name: Generate update manifests
        run: bun run dist:manifest

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s-agi-macos
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/latest-mac*.yml

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun i

      - name: Build and package Windows
        run: bun run electron:dist:win

      - name: Generate update manifests
        run: bun run dist:manifest

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s-agi-windows
          path: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/s-agi-macos/*.dmg
            artifacts/s-agi-macos/*.zip
            artifacts/s-agi-macos/*.yml
            artifacts/s-agi-windows/*.exe
            artifacts/s-agi-windows/*.yml
