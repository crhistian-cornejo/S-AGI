name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: bun i

      - name: Remove workspace symlinks
        run: rm -rf node_modules/@s-agi

      - name: Clean release directory
        run: rm -rf apps/electron/release

      - name: Import Code Signing Certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate from base64
          echo "$CSC_LINK" | base64 --decode > $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build and package macOS
        run: bun run build && npx electron-builder --config apps/electron/electron-builder.yml --mac --publish never
        env:
          USE_HARD_LINKS: false

      - name: Generate manifests (fallback)
        run: |
          # electron-builder should generate latest-mac.yml, but run custom script as safety net
          if [ ! -f apps/electron/release/latest-mac.yml ]; then
            echo "::warning::electron-builder did not generate latest-mac.yml, using fallback script"
            bun run dist:manifest
          fi

      - name: Verify release artifacts
        run: |
          echo "=== Release artifacts ==="
          ls -la apps/electron/release/
          echo ""
          echo "=== Checking required files ==="
          test -f apps/electron/release/latest-mac.yml || { echo "::error::Missing latest-mac.yml"; exit 1; }
          ls apps/electron/release/*.zip >/dev/null 2>&1 || { echo "::error::Missing ZIP files"; exit 1; }
          echo "All required artifacts present"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s-agi-macos
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.blockmap
            apps/electron/release/latest-mac*.yml

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: bun i

      - name: Remove workspace symlinks
        run: Remove-Item -Recurse -Force node_modules/@s-agi -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Clean release directory
        run: Remove-Item -Recurse -Force apps/electron/release -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build and package Windows
        run: bun run build && npx electron-builder --config apps/electron/electron-builder.yml --win --publish never
        env:
          USE_HARD_LINKS: false

      - name: Generate manifests (fallback)
        run: |
          if (!(Test-Path "apps/electron/release/latest.yml")) {
            Write-Host "::warning::electron-builder did not generate latest.yml, using fallback script"
            bun run dist:manifest
          }
        shell: pwsh

      - name: Verify release artifacts
        run: |
          Write-Host "=== Release artifacts ==="
          Get-ChildItem apps/electron/release/
          Write-Host ""
          if (!(Test-Path "apps/electron/release/latest.yml")) {
            Write-Host "::error::Missing latest.yml"
            exit 1
          }
          $exeFiles = Get-ChildItem apps/electron/release/*.exe -ErrorAction SilentlyContinue
          if (-not $exeFiles) {
            Write-Host "::error::Missing EXE files"
            exit 1
          }
          Write-Host "All required artifacts present"
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s-agi-windows
          path: |
            apps/electron/release/*.exe
            apps/electron/release/*.blockmap
            apps/electron/release/latest.yml

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/s-agi-macos/*.dmg
            artifacts/s-agi-macos/*.zip
            artifacts/s-agi-macos/*.blockmap
            artifacts/s-agi-macos/*.yml
            artifacts/s-agi-windows/*.exe
            artifacts/s-agi-windows/*.blockmap
            artifacts/s-agi-windows/*.yml
